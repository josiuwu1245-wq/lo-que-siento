<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tulipanes infinitos</title>
<meta name="description" content="Un jardín infinito de tulipanes para decir lo que siento.">
<meta name="theme-color" content="#12011f">
<meta property="og:type" content="website">
<meta property="og:title" content="Tulipanes infinitos">
<meta property="og:description" content="Un jardín infinito de tulipanes para decir lo que siento.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#12011f;--ac:#ff4fa3;--tx:#f3e6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Montserrat',system-ui,sans-serif;overflow:hidden}
#stage canvas,#tun{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 45%,rgba(5,0,12,.75) 100%)}
.ui{position:fixed;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:1rem;z-index:5;text-align:center;transition:opacity 1.2s}
#intro{bottom:calc(env(safe-area-inset-bottom,0px) + 11vh)}
#intro h1{font-weight:300;font-size:clamp(1.1rem,4vw,1.7rem);letter-spacing:.35em;margin:0;text-indent:.35em;text-shadow:0 0 24px var(--ac)}
#intro small{opacity:.6;letter-spacing:.2em;font-weight:300}
#feel{bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);opacity:0;pointer-events:none}
#feel.show{opacity:1;pointer-events:auto}
#intro.hide{opacity:0;pointer-events:none}
.btn{font:500 .95rem 'Montserrat',sans-serif;letter-spacing:.3em;text-indent:.3em;color:var(--tx);background:rgba(40,4,70,.55);border:1px solid var(--ac);border-radius:999px;padding:1rem 2.4rem;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(255,79,163,.45),inset 0 0 14px rgba(255,79,163,.25);animation:pulse 2.4s ease-in-out infinite;transition:transform .2s}
.btn:hover{transform:scale(1.06)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes pulse{50%{box-shadow:0 0 34px rgba(255,79,163,.9),inset 0 0 20px rgba(255,79,163,.4)}}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:6;display:none;background:none;border:1px solid rgba(255,255,255,.3);color:var(--tx);width:38px;height:38px;border-radius:50%;cursor:pointer}
#tun{z-index:31;display:none;opacity:0;transition:opacity .6s}
#flash{position:fixed;inset:0;background:#fff;z-index:40;opacity:0;pointer-events:none}
#letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at 50% 40%,#3a0a66 0%,#16022a 60%,#09010f 100%);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px}
#rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#rain span{position:absolute;top:0;animation:fall linear infinite;opacity:.55}
@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(360deg)}}
.paper{position:relative;width:min(640px,100%);max-height:88vh;overflow-y:auto;box-sizing:border-box;padding:clamp(1.6rem,5vw,3.2rem);background:linear-gradient(160deg,#fbf3e6,#efdfca);color:#3b2147;border-radius:4px;box-shadow:0 0 80px rgba(255,79,163,.35),0 30px 60px rgba(0,0,0,.6);opacity:0}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid rgba(139,30,90,.35);pointer-events:none}
.paper.in{animation:enter 6s cubic-bezier(.45,0,.25,1) forwards;will-change:transform,opacity}
@keyframes enter{from{opacity:0;transform:translateY(9vh)}to{opacity:1;transform:none}}
#lt{font:400 clamp(2.4rem,8vw,3.6rem)/1.1 'Great Vibes',cursive;color:#8b1e5a;margin:0 0 1.2rem}
#lb p{font:italic 400 clamp(1.15rem,3.6vw,1.4rem)/1.65 'Cormorant Garamond',Georgia,serif;margin:0 0 1rem;opacity:0;animation:up 1.4s ease forwards}
.sig{font:400 2rem 'Great Vibes',cursive;color:#8b1e5a;margin:1.4rem 0 0;text-align:right;opacity:0;animation:up 1.6s ease forwards}
#again{display:block;margin:1rem auto 0;background:none;border:0;color:#8b1e5a;font:italic 1rem 'Cormorant Garamond',serif;cursor:pointer;opacity:.7}
#boomBtn{display:block;margin:1.6rem auto 0;background:#8b1e5a;color:#fbf3e6;border:0;border-radius:999px;padding:.8rem 1.7rem;font:500 .78rem 'Montserrat',sans-serif;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 22px rgba(139,30,90,.35);transition:transform .2s,box-shadow .2s}
#boomBtn:hover{transform:scale(1.05);box-shadow:0 10px 28px rgba(139,30,90,.5)}
#boomBtn:disabled{opacity:.6;cursor:default;transform:none}
#hx{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(58,10,102,.94),rgba(6,0,15,.98));opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;overflow:hidden;will-change:transform}
#hx.on{opacity:1;visibility:visible}
#hx::before{content:"";position:absolute;width:min(92vw,620px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,79,163,.4),rgba(255,79,163,.12) 45%,transparent 68%);opacity:0;transform:scale(.8);z-index:0;will-change:transform,opacity}
#hx.on::before{animation:glowPulse 1s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:.85;transform:scale(1.18)}}
#hx.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:translate(0,0)}12%{transform:translate(-10px,5px)}25%{transform:translate(9px,-6px)}38%{transform:translate(-7px,-4px)}52%{transform:translate(6px,5px)}68%{transform:translate(-3px,2px)}85%{transform:translate(2px,-1px)}}
#hh{position:relative;z-index:1;width:min(54vw,380px);height:auto;transform:scale(.1);filter:drop-shadow(0 0 24px rgba(255,45,111,.95)) drop-shadow(0 0 70px rgba(255,45,111,.5));will-change:transform,opacity}
#hh.beat{animation:beatIn 3s ease-in-out forwards}
#hh.burst{animation:burst .8s cubic-bezier(.15,.75,.3,1) forwards}
@keyframes beatIn{
  0%{transform:scale(.1);opacity:0}
  8%{transform:scale(1.12);opacity:1}
  16%{transform:scale(.9)}
  24%{transform:scale(1.06)}
  32%{transform:scale(.92)}
  40%{transform:scale(1.04)}
  48%{transform:scale(.93)}
  56%{transform:scale(1.03)}
  64%{transform:scale(.95)}
  72%{transform:scale(1.02)}
  80%{transform:scale(.96)}
  88%{transform:scale(1.01)}
  100%{transform:scale(1);opacity:1}
}
@keyframes burst{0%{transform:scale(1);opacity:1}30%{transform:scale(1.4);opacity:1}100%{transform:scale(3.2);opacity:0}}
#hw{position:absolute;inset:0;margin:auto;width:min(54vw,380px);height:auto;opacity:0;transform:scale(1);pointer-events:none;will-change:transform,opacity}
#hw.on{animation:whiteOut .5s ease-out forwards}
@keyframes whiteOut{0%{opacity:1;transform:scale(1)}55%{opacity:.9;transform:scale(1.8)}100%{opacity:0;transform:scale(2.7)}}
#hx b{position:absolute;left:50%;top:50%;width:min(50vw,340px);aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,140,190,.95);opacity:0;transform:translate(-50%,-50%) scale(.1);box-shadow:0 0 26px rgba(255,79,163,.75),inset 0 0 26px rgba(255,79,163,.45);animation:ringOut 1.15s cubic-bezier(.2,.7,.3,1) forwards;will-change:transform,opacity}
@keyframes ringOut{0%{opacity:.95;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(6)}}
#hx i{position:absolute;left:50%;top:50%;font-style:normal;line-height:1;opacity:0;text-shadow:0 0 14px currentColor;animation:fly 1.5s cubic-bezier(.12,.65,.3,1) forwards;will-change:transform,opacity}
@keyframes fly{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0)}
  12%{opacity:1}
  72%{opacity:.9}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.05) rotate(var(--rz))}
}
#letter.solo .paper{background:none;box-shadow:none;max-height:none;overflow:visible;display:flex;align-items:center;justify-content:center;padding:0;width:100%}
#letter.solo .paper::before{display:none}
#letter.solo #lt,#letter.solo #lb,#letter.solo .sig,#letter.solo #boomBtn,#letter.solo #rain{display:none}
#letter.solo #again{margin:0;opacity:1;font:500 1rem 'Montserrat',sans-serif;letter-spacing:.24em;text-transform:uppercase;padding:1rem 2.2rem;border:1px solid rgba(139,30,90,.65);border-radius:999px;background:rgba(251,243,230,.9);color:#8b1e5a}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.btn{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vig"></div>
<button id="snd" aria-label="Sonido">♪</button>
<div id="intro" class="ui"><h1 id="ti"></h1><button class="btn" id="on"></button><small id="sm"></small></div>
<div id="feel" class="ui"><button class="btn" id="fe"></button></div>
<canvas id="tun"></canvas>
<div id="flash"></div>
<section id="letter"><div id="rain"></div><article class="paper" id="paper"><h1 id="lt"></h1><div id="lb"></div><p class="sig" id="ls"></p><button id="boomBtn" type="button">explotar corazón</button><button id="again">volver al jardín</button></article></section>
<div id="hx" aria-hidden="true"><svg id="hh" viewBox="0 0 34 29"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ab8"/><stop offset="1" stop-color="#e0103f"/></linearGradient></defs><path fill="url(#hg)" d="M23.6 0c-2.7 0-5.1 1.3-6.6 3.4C15.5 1.3 13.1 0 10.4 0 4.7 0 0 4.7 0 10.4c0 11 17 18.6 17 18.6s17-7.6 17-18.6C34 4.7 29.3 0 23.6 0z"/></svg><svg id="hw" viewBox="0 0 34 29" aria-hidden="true"><path fill="#fff" d="M23.6 0c-2.7 0-5.1 1.3-6.6 3.4C15.5 1.3 13.1 0 10.4 0 4.7 0 0 4.7 0 10.4c0 11 17 18.6 17 18.6s17-7.6 17-18.6C34 4.7 29.3 0 23.6 0z"/></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ PERSONALIZA AQUÍ ============ */
const CONFIG={
  titulo:"hay algo que tengo que decir",
  textoIntro:"toca para encender la luz de la sinceridad de mi corazón",
  textoPrender:"Prender",
  textoSiento:"Lo que siento",
  colores:["#ff3d8b","#ff7ab8","#c13cff","#ff2d55","#ffc2e0","#8a5cff","#ffd6e8","#ff5fa2","#ffb347"], // colores de los tulipanes
  colorFondo:"#12011f",      // morado oscuro
  cantidadTulipanes:620,     // tulipanes por todo el campo, también a los lados (si va lento en tu celular baja a 300)
  velocidad:1.2,             // qué tan rápido avanza el jardín infinito
  colorCentro:"#ff3d8b",     // color del tulipán que explota
  colorCielo:"#0e0220",      // morado oscuro de arriba
  colorHorizonte:"#35125c",  // morado más claro de la neblina
  colorPasto:"#1f6a40",      // verde del pasto
  pastoDensidad:19000,       // cantidad de hojitas de pasto
  brillo:.7,                // 1 = normal, súbele para más luz
  viento:1,                  // 0 = quieto, 2 = mucho viento
  aperturaCampo:.05,         // 0 = tulipanes totalmente cerrados, 1 = abiertos
  sonidos:true,              // efectos de sonido (botones, corazón, explosión, carta)
  volumenEfectos:.8,         // volumen de los efectos (0 a 1)
  zoomMin:-5, zoomMax:9,     // qué tanto te puedes alejar (-) y acercar (+)
  textoAyuda:"arrastra para mirar · rueda o pellizca para acercar",
  musica:true,
  bpm:62,                    // velocidad de la música: más bajo = más lento y romántico
  volumenMusica:.4,          // volumen de la música (0 a 1)
  musicaUrl:"",              // opcional: enlace a tu propio mp3 (si está vacío suena la música romántica generada)
  carta:{
    saludo:"Para ti",
    parrafos:[
      "No sé en qué momento empezó todo y nose kie mas wey dame texto hdp."
    ],
    despedida:"Si,",
    firma:"gei"
  }
};
/* =========================================== */
const $=s=>document.querySelector(s);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const rnd=(a,b)=>a+Math.random()*(b-a);
document.documentElement.style.setProperty('--bg',CONFIG.colorFondo);
$('#ti').textContent=CONFIG.titulo;$('#sm').textContent=CONFIG.textoIntro;$('#on').textContent=CONFIG.textoPrender;$('#fe').textContent=CONFIG.textoSiento;

/* ---------- escena 3D ---------- */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,1.75));$('#stage').appendChild(R.domElement);
const scene=new THREE.Scene();
(function(){const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,CONFIG.colorCielo);g.addColorStop(.52,CONFIG.colorHorizonte);g.addColorStop(1,CONFIG.colorHorizonte);x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c);})();
scene.fog=new THREE.FogExp2(CONFIG.colorHorizonte,.017);
const cam=new THREE.PerspectiveCamera(55,1,.1,220),BR=CONFIG.brillo;
const amb=new THREE.AmbientLight(0xb08cff,.5),hemi=new THREE.HemisphereLight(0xe3c4ff,0x1f6b3c,.5),dir=new THREE.DirectionalLight(0xfff0f8,.5),pt=new THREE.PointLight(0xff5aa8,1,24,2);
dir.position.set(4,9,6);pt.position.set(0,2,4.5);scene.add(amb,hemi,dir,pt);
const GROUND=-2.4,HZ=2.2,uT={value:0},uS={value:0},uW={value:CONFIG.viento},uL={value:1};

/* pasto: textura que avanza + hojas de pasto que se mecen */
const gt=(function(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle=CONFIG.colorPasto;x.fillRect(0,0,512,512);
  for(let i=0;i<9000;i++){const g=Math.random();x.strokeStyle=`hsl(${100+g*45},${45+g*30}%,${14+g*28}%)`;x.lineWidth=1+Math.random()*1.4;const px=rnd(0,512),py=rnd(0,512);x.beginPath();x.moveTo(px,py);x.lineTo(px+rnd(-3,3),py-rnd(6,16));x.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(80,80);t.anisotropy=8;return t;})();
const gr=new THREE.Mesh(new THREE.PlaneGeometry(320,320),new THREE.MeshStandardMaterial({map:gt,roughness:.95}));
gr.rotation.x=-Math.PI/2;gr.position.y=GROUND;scene.add(gr);
const bg=new THREE.InstancedBufferGeometry();
bg.setAttribute('position',new THREE.Float32BufferAttribute([-.03,0,0,.03,0,0,-.02,.3,0,.02,.3,0,0,.6,0],3));
bg.setAttribute('color',new THREE.Float32BufferAttribute([.1,.28,.12,.1,.28,.12,.3,.65,.25,.3,.65,.25,.75,1,.5],3));
bg.setIndex([0,1,2,1,3,2,2,3,4]);
const NB=CONFIG.pastoDensidad,aP=new Float32Array(NB*3),aS=new Float32Array(NB*2),aT=new Float32Array(NB);
for(let i=0;i<NB;i++){aP[i*3]=rnd(-34,34);aP[i*3+1]=rnd(-116,16);aP[i*3+2]=rnd(0,6.28);aS[i*2]=rnd(.7,1.4);aS[i*2+1]=rnd(.7,1.7);aT[i]=rnd(.65,1.1);}
bg.setAttribute('aP',new THREE.InstancedBufferAttribute(aP,3));bg.setAttribute('aS',new THREE.InstancedBufferAttribute(aS,2));bg.setAttribute('aT',new THREE.InstancedBufferAttribute(aT,1));bg.instanceCount=NB;
const bm=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide});
bm.onBeforeCompile=s=>{s.uniforms.uT=uT;s.uniforms.uS=uS;s.uniforms.uW=uW;s.uniforms.uL=uL;
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform float uT;uniform float uS;uniform float uW;uniform float uL;attribute vec3 aP;attribute vec2 aS;attribute float aT;')
  .replace('#include <color_vertex>','#include <color_vertex>\nvColor*=aT*uL;')
  .replace('#include <begin_vertex>','#include <begin_vertex>\nfloat zf=mod(aP.y+uS+100.,116.)-100.;float hh=position.y/.6;hh*=hh;float ph=uT*2.2+aP.x*.35+zf*.22;vec3 q=position*aS.x;q.y*=aS.y;q.x+=(sin(ph)*.13+sin(ph*2.7)*.03)*hh*aS.y*uW;q.z+=cos(ph*.7)*.08*hh*aS.y*uW;float cc=cos(aP.z),ss=sin(aP.z);transformed=vec3(q.x*cc+q.z*ss,q.y,-q.x*ss+q.z*cc)+vec3(aP.x,0.,zf);');};
const blades=new THREE.Mesh(bg,bm);blades.position.y=GROUND;blades.frustumCulled=false;scene.add(blades);

/* pétalos: degradado crema → color → punta, con venas y borde claro */
function buildPetal(s,nu,nv,col){
  const P=[],C=[],I=[],base=col.clone().lerp(new THREE.Color(1,1,.9),.78),tip=col.clone().multiplyScalar(1.12),edge=new THREE.Color(1,1,1);
  for(let i=0;i<=nu;i++){const u=i/nu,
    Rr=(.1+.42*Math.sin(Math.PI*Math.pow(u,.75)))*s+.12*Math.pow(u,3)*s,
    a=.66*Math.pow(Math.sin(Math.PI*(.04+.9*u)),.5)*(1-.55*Math.pow(u,5));
    for(let j=0;j<=nv;j++){const v=j/nv*2-1,g=v*a;
      P.push(Rr*Math.cos(g)-.1,u*1.5,Rr*Math.sin(g));
      const c=base.clone().lerp(col,sm(0,.55,u)).lerp(tip,sm(.6,1,u)).lerp(edge,Math.pow(Math.abs(v),4)*.3*u);
      c.multiplyScalar(.9+.1*Math.cos(v*8));C.push(c.r,c.g,c.b);}}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j;I.push(a,a+1,a+nv+1,a+1,a+nv+2,a+nv+1);}
  return{P,C,I};
}
function fullPetal(s,col){const d=buildPetal(s,18,12,col),g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(d.P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(d.C,3));g.setIndex(d.I);g.computeVertexNormals();return g;}
/* cabeza completa en una sola malla con "morph" cerrado→abierto (para tener cientos) */
function headGeo(col,nu,nv){
  const c0=[],c1=[],cc=[],ii=[];let off=0;
  for(let k=0;k<6;k++){const outer=k<3,th=(k%3)*2.094+(outer?0:1.047),pd=buildPetal(outer?1.07:.97,nu,nv,col);
    for(let q=0;q<pd.P.length;q+=3){const x=pd.P[q],y=pd.P[q+1],z=pd.P[q+2];
      [[c0,0],[c1,1]].forEach(([arr,o])=>{const f=-(o*(outer?.8:.52)),cf=Math.cos(f),sf=Math.sin(f),px=x*cf-y*sf+.1,py=x*sf+y*cf;
        arr.push(px*Math.cos(th)+z*Math.sin(th),py,-px*Math.sin(th)+z*Math.cos(th));});}
    cc.push(...pd.C);pd.I.forEach(n=>ii.push(n+off));off+=pd.P.length/3;}
  const g=new THREE.BufferGeometry(),g2=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(c0,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cc,3));g.setIndex(ii);g.computeVertexNormals();
  g2.setAttribute('position',new THREE.Float32BufferAttribute(c1,3));g2.setIndex(ii);g2.computeVertexNormals();
  g.morphAttributes.position=[g2.attributes.position];g.morphAttributes.normal=[g2.attributes.normal];return g;
}
/* tallo + hojas fusionados, con viento en el shader */
function merge(list){const P=[],N=[],I=[];let off=0;
  list.forEach(g=>{const p=g.attributes.position.array;P.push(...p);N.push(...g.attributes.normal.array);g.index.array.forEach(i=>I.push(i+off));off+=p.length/3;});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));g.setIndex(I);return g;}
function leafGeo(){const nu=12,nv=4,P=[],I=[];
  for(let i=0;i<=nu;i++){const u=i/nu,w=.2*Math.sin(Math.PI*Math.pow(u,.65));for(let j=0;j<=nv;j++){const v=j/nv*2-1;P.push(.6*u*u+Math.abs(v)*w*.25,u*1.7*(1-.15*u),v*w);}}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j;I.push(a,a+1,a+nv+1,a+1,a+nv+2,a+nv+1);}

  const pad=(f,t,d,v)=>{voice('triangle',f,t,d*.4,d,v,-8);voice('triangle',f,t,d*.4,d,v,8);};
  /* Fmaj7 - Em7 - Am7 - G7 */
  const CH=[{r:87.3,n:[174.6,220,261.6,329.6]},{r:82.4,n:[164.8,196,246.9,293.7]},{r:110,n:[220,261.6,329.6,392]},{r:98,n:[196,246.9,293.7,349.2]}];
  const st=60/CONFIG.bpm/2;let n=0,nt=A.currentTime+.2;
  setInterval(()=>{while(nt<A.currentTime+.3){
    const s=n%8,c=CH[Math.floor(n/8)%4],tt=nt+(s%2?st*.14:0);
    if(s==0){c.n.forEach(f=>{pad(f,tt,st*8,.022);ep(f,tt,2.4,.03,true);});voice('sine',c.r,tt,.02,1.2,.5);}
    if(s==3||s==7)c.n.slice(1).forEach(f=>ep(f,tt,.5,.02,false));
    if(s==3)voice('sine',c.r*2,tt,.01,.2,.25);
    if((s==2||s==5)&&Math.random()<.5)ep(c.n[Math.floor(Math.random()*4)]*2,tt,1.8,.04,true);
    nt+=st;n++;}},80);
}

function grabTulip(){
  let bi=-1,bd=1e9;
  field.forEach((f,i)=>{if(!f.t.g.visible)return;const p=f.t.g.position,d=Math.abs(p.z+6)+Math.abs(p.x)*1.5;if(d<bd){bd=d;bi=i;}});
  const best=bi>=0?field[bi]:null;
  const p=best?best.t.g.position.clone():new THREE.Vector3(0,GROUND,-6);
  const sc=best?best.t.g.scale.x:1;
  if(best){best.t.g.visible=false;field.splice(bi,1);}
  gSBase=sc*1.15;GS.set(p.x,GROUND,p.z);
  grab.g.position.copy(GS);grab.g.scale.setScalar(gSBase);
  grab.g.visible=true;grab.stem.visible=true;grab.head.visible=true;
  grab.pv.forEach(q=>{q.piv.rotation.set(0,0,0);});
  grabMat.opacity=1;grabMat.emissiveIntensity=.2;
  grab.active=true;gBurst=false;gT0=clock.elapsedTime;
}

function burstGrab(){
  sfxExplode();sh=2.4;grabMat.emissiveIntensity=.85;
  pf.animate([{opacity:0},{opacity:.6},{opacity:0}],{duration:900,easing:'ease-out'});
  const hw=new THREE.Vector3();grab.head.getWorldPosition(hw);
  const right=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0),
        up=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1),
        fwd=new THREE.Vector3();cam.getWorldDirection(fwd);
  const addP=(m,v,bill)=>{
    scene.add(m);
    const d={m,v,w:new THREE.Vector3(0,0,rnd(-.9,.9)),g:rnd(.12,.2),bill:!!bill};
    if(bill)d.ang=rnd(0,6.283);
    grabDebris.push(d);
  };
  grab.pv.forEach(pt=>{
    scene.attach(pt.m);
    addP(pt.m,fwd.clone().multiplyScalar(rnd(1,3.5)).addScaledVector(right,rnd(-2.5,2.5)).addScaledVector(up,rnd(-1.8,1.8)));
  });
  for(let i=0;i<52;i++){
    const m=new THREE.Mesh(i%2?GHI:GHO,grabMat);
    m.scale.setScalar(rnd(1.3,2.5));
    m.position.copy(hw)
      .addScaledVector(right,rnd(-3.6,3.6))
      .addScaledVector(up,rnd(-3,3))
      .addScaledVector(fwd,rnd(-3,1.5));
    m.quaternion.copy(cam.quaternion);
    addP(m,new THREE.Vector3().addScaledVector(right,rnd(-1.1,1.1)).addScaledVector(up,rnd(-.9,.9)).addScaledVector(fwd,rnd(-.2,1)).multiplyScalar(rnd(.35,1.1)),true);
  }
  grab.stem.visible=false;grab.head.visible=false;
  setTimeout(wormhole,3900);
}

function wormhole(){sfxWormhole();
  const c=$('#tun'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio,1.5);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const w=innerWidth,h=innerHeight,cx=w/2,cy=h/2,mx=Math.hypot(cx,cy);
  c.style.display='block';requestAnimationFrame(()=>c.style.opacity=1);
  const fp=$('#flash');fp.style.transition='none';fp.style.display='block';fp.style.opacity=.8;
  requestAnimationFrame(()=>{fp.style.transition='opacity 1.3s';fp.style.opacity=0;});
  setTimeout(()=>{fp.style.transition='none';fp.style.opacity=0;},1500);
  const PC=[CONFIG.colorCentro,'#ff7ab8','#ffc2e0','#ffd6e8','#ff5fa2','#c13cff','#8a5cff','#ffb347'];
  const P=Array.from({length:220},(_,i)=>({a:rnd(0,6.283),z:rnd(.35,1),c:PC[i%PC.length],w:rnd(.8,2.4)}));
  const t0=performance.now(),D=6;let last=t0;
  x.fillStyle='#06000f';x.fillRect(0,0,w,h);
  setTimeout(()=>{cancelAnimationFrame(raf);const st=$('#stage');if(st)st.style.display='none';},1000);
  (function f(now){
    const t=(now-t0)/1000,dt=Math.min((now-last)/1000,.05);last=now;
    x.fillStyle='rgba(6,0,16,.25)';x.fillRect(0,0,w,h);x.lineCap='round';
    const sp=.5+t*t*.22;
    for(const p of P){
      const z1=p.z,z2=z1-sp*dt;
      if(z2<=.02){p.z=1;p.a=rnd(0,6.283);continue;}
      const r=z=>mx*.035/Math.max(z,.012);
      const r1=r(z1),r2=r(z2),ca=Math.cos(p.a),sa=Math.sin(p.a);
      x.globalAlpha=Math.min(1,(1-z2)*1.4);x.strokeStyle=p.c;x.lineWidth=(.6+(1-z2)*2.6)*p.w;
      x.beginPath();x.moveTo(cx+r1*ca,cy+r1*sa);x.lineTo(cx+r2*ca,cy+r2*sa);x.stroke();
      p.z=z2;
    }
    x.globalAlpha=1;
    x.lineWidth=2;
    for(let k=0;k<3;k++){const q=(t*(.5+t*.25)+k/3)%1;
      x.strokeStyle=`hsla(${320+q*40},100%,70%,${(1-q)*.4})`;x.beginPath();x.arc(cx,cy,mx*.03*Math.pow(45,q),0,6.283);x.stroke();}
    const gg=x.createRadialGradient(cx,cy,0,cx,cy,mx*(.08+t*.12));
    gg.addColorStop(0,`rgba(255,255,255,${Math.min(.9,t*.3)})`);gg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gg;x.fillRect(0,0,w,h);
    if(t>D-.7)$('#flash').style.opacity=Math.min(1,(t-(D-.7))/.7);
    if(t<D)requestAnimationFrame(f);else showLetter();
  })(performance.now());
}

function showLetter(){sfxLetter();
  cancelAnimationFrame(raf);
  $('#stage').style.display='none';$('#vig').style.display='none';$('#tun').remove();
  $('#intro').style.display='none';$('#feel').style.display='none';
  const C=CONFIG.carta;$('#letter').style.display='flex';$('#lt').textContent=C.saludo;
  const lb=$('#lb');let d=1.6;
  C.parrafos.forEach(t=>{const p=document.createElement('p');p.textContent=t;p.style.animationDelay=d+'s';d+=1.4+t.length/90;lb.appendChild(p);});
  const sg=$('#ls');sg.innerHTML='';sg.append(C.despedida,document.createElement('br'),C.firma);sg.style.animationDelay=d+'s';
  const rain=$('#rain');
  for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent='🌷';s.style.left=rnd(0,96)+'%';s.style.fontSize=rnd(18,34)+'px';s.style.animationDuration=rnd(9,18)+'s';s.style.animationDelay=-rnd(0,18)+'s';rain.appendChild(s);}
  const fl=$('#flash');fl.style.transition='opacity 1.8s';
  requestAnimationFrame(()=>{$('#paper').classList.add('in');fl.style.opacity=0;});
  setTimeout(()=>fl.style.display='none',2000);
}

const HEART_COLORS=['#ff4d8d','#ff7ab8','#ffc2e0','#ff2d55','#c13cff','#ff5fa2','#ffb347','#ffd6e8'];
function heartParticles(hx){
  for(let i=0;i<66;i++){
    const s=document.createElement('i'),big=i%4===0,a=rnd(0,6.283),d=big?rnd(16,46):rnd(30,90);
    s.textContent=i%3?'♥':'❤';
    s.style.color=HEART_COLORS[i%HEART_COLORS.length];
    s.style.fontSize=(big?rnd(26,46):rnd(12,26))+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'vmin');
    s.style.setProperty('--dy',(Math.sin(a)*d*.9).toFixed(1)+'vmin');
    s.style.setProperty('--rz',rnd(-260,260).toFixed(0)+'deg');
    s.style.animationDelay=(i%8)*.025+'s';
    s.style.animationDuration=rnd(1.2,2.2)+'s';
    hx.appendChild(s);
  }
}
function heartRings(hx){
  for(let i=0;i<3;i++){const r=document.createElement('b');r.style.animationDelay=i*.11+'s';hx.appendChild(r);}
}
